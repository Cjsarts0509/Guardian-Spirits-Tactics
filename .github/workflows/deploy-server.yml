# 게임 서버 수동 배포 (초안 — 인프라 확정 후 시크릿 등록하고 사용)
# 필요한 시크릿: ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY
name: Deploy server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @gst/server build
      - name: Upload & restart
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 600 /dev/null key && echo "$KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new apps/server/dist/index.js "$SSH_USER@$HOST:/tmp/gst-server.mjs"
          ssh -i key "$SSH_USER@$HOST" 'sudo install -o gst -g gst -m 644 /tmp/gst-server.mjs /opt/gst/server.mjs && sudo systemctl restart gst-server && sleep 1 && curl -fsS http://127.0.0.1:8787/health'
          rm -f key
